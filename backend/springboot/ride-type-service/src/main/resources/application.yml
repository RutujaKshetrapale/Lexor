server:
  port: ${PORT:8089}
  servlet:
    context-path: /

spring:
  application:
    name: ride-type-service

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lexor_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:${LEXOR_JWT_SECRET:}}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lexor.ridetype: ${LOG_LEVEL_RIDETYPE:DEBUG}
    org.springframework.security: INFO
