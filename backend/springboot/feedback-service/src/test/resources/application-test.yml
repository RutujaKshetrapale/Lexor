server:
  port: 0

spring:
  application:
    name: feedback-service-test

  datasource:
    url: jdbc:h2:mem:feedback_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    open-in-view: false

feedback:
  policy:
    edit-window-minutes: 120
    submission-window-days: 7
    edit-enabled: true
    report-auto-review-threshold: 3
  jwt:
    secret: lexor-default-jwt-secret-key-32-chars-long!
    expiration-ms: 86400000
  security:
    internal-service-key: lexor-internal-service-secret-key-2026
  services:
    booking-url: http://localhost:8095
    notification-url: http://localhost:8099
