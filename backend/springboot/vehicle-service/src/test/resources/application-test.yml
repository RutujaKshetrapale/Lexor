server:
  port: 8087

spring:
  application:
    name: vehicle-service-test

  datasource:
    url: jdbc:h2:mem:lexordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=YEAR,year
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000

lexor:
  storage:
    location: target/test-uploads
    allowed-extensions: pdf,jpg,jpeg,png,webp
  verification:
    required-documents: REGISTRATION_CERTIFICATE,VEHICLE_INSURANCE,POLLUTION_UNDER_CONTROL

logging:
  level:
    root: INFO
    com.lexor.vehicle: DEBUG
