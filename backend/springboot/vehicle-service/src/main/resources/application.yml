server:
  port: ${PORT:8087}
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-service

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lexor_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:15MB}

jwt:
  secret: ${JWT_SECRET:${LEXOR_JWT_SECRET:}}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

lexor:
  storage:
    location: ${STORAGE_LOCATION:uploads/vehicle-documents}
    allowed-extensions: ${ALLOWED_EXTENSIONS:pdf,jpg,jpeg,png,webp}
  verification:
    required-documents: ${REQUIRED_DOCUMENTS:REGISTRATION_CERTIFICATE,VEHICLE_INSURANCE,POLLUTION_UNDER_CONTROL}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.lexor.vehicle: DEBUG
    org.springframework.security: INFO
