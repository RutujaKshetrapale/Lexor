server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Auth Service Routes (Public)
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # User Service Routes (Rider & User profiles)
        - id: user-service-users-route
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/users/**

        - id: user-service-riders-route
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/riders/**

        # Booking Service Driver Routes (Specific path before driver-service)
        - id: booking-service-driver-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/drivers/me/bookings/**

        # Driver Matching Service Location Ingestion
        - id: driver-matching-location-route
          uri: ${DRIVER_MATCHING_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/v1/drivers/me/location/**

        # Feedback Service Driver Routes (Specific path before driver-service)
        - id: feedback-service-driver-rides-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/drivers/me/rides/**

        - id: feedback-service-driver-feedback-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/drivers/me/feedback/**

        - id: feedback-service-driver-rating-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/drivers/me/rating-summary/**

        - id: feedback-service-driver-summary-public-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/drivers/*/rating-summary

        # Driver Service Routes
        - id: driver-service-route
          uri: ${DRIVER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/drivers/**

        - id: driver-service-admin-route
          uri: ${DRIVER_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/admin/drivers/**

        # Vehicle Service Routes
        - id: vehicle-service-route
          uri: ${VEHICLE_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/vehicles/**

        - id: vehicle-service-admin-route
          uri: ${VEHICLE_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/admin/vehicles/**

        # Ride Type Service Routes
        - id: ride-type-service-route
          uri: ${RIDE_TYPE_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/ride-types/**

        - id: ride-type-service-admin-route
          uri: ${RIDE_TYPE_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/admin/ride-types/**

        # Ride Request Service Routes
        - id: ride-request-service-route
          uri: ${RIDE_REQUEST_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/ride-requests/**

        - id: ride-request-service-admin-route
          uri: ${RIDE_REQUEST_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/admin/ride-requests/**

        # Booking Service Routes
        - id: booking-service-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/bookings/**

        - id: booking-service-admin-route
          uri: ${BOOKING_SERVICE_URL:http://localhost:8095}
          predicates:
            - Path=/api/v1/admin/bookings/**

        # Payment Service Routes
        - id: payment-service-driver-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/driver/payments/**

        - id: payment-service-admin-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/admin/payments/**

        - id: payment-service-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8097}
          predicates:
            - Path=/api/v1/payments/**

        # Notification Service Routes
        - id: notification-service-admin-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/admin/notifications/**

        - id: notification-service-route
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8099}
          predicates:
            - Path=/api/v1/notifications/**

        # Feedback Service Routes
        - id: feedback-service-admin-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/admin/feedback/**

        - id: feedback-service-route
          uri: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/v1/feedback/**

        # Admin Operations Service Routes (Phase 14)
        - id: admin-operations-service-route
          uri: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/v1/admin/operations/**

        - id: admin-analytics-service-route
          uri: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/v1/admin/analytics/**

        - id: admin-health-monitor-service-route
          uri: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/v1/admin/health-monitor/**

        - id: admin-audit-logs-service-route
          uri: ${ADMIN_OPERATIONS_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/v1/admin/audit-logs/**

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

gateway:
  jwt:
    secret: ${JWT_SECRET:${LEXOR_JWT_SECRET:lexor-default-jwt-secret-key-32-chars-long!}}
    issuer: LEXOR
    audience: LEXOR
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Correlation-Id,X-Requested-With,Accept
    allow-credentials: true
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:50}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:100}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.lexor.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
