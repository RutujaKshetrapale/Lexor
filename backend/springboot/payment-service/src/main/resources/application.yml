server:
  port: ${PORT:8097}

spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lexor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItbGV4b3Itc21hcnQtbW9iaWxpdHktMjAyNC1qd3QtdG9rZW4tc2VjcmV0LWtleQ==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  booking-url: ${BOOKING_SERVICE_URL:http://localhost:8095}
  timeout-seconds: ${DOWNSTREAM_TIMEOUT_SECONDS:5}

payment:
  provider: ${PAYMENT_PROVIDER:RAZORPAY}
  commission-percentage: ${PLATFORM_COMMISSION_PERCENTAGE:20.00}
  currency: ${PAYMENT_CURRENCY:INR}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_sample_key_123456}
    key-secret: ${RAZORPAY_KEY_SECRET:sample_razorpay_secret_654321}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:sample_webhook_secret_987654}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
