server:
  port: ${PORT:8091}

spring:
  application:
    name: ride-request-service

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lexor_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:${LEXOR_JWT_SECRET:}}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

services:
  ride-type-service:
    url: ${RIDE_TYPE_SERVICE_URL:http://localhost:8089}
    connect-timeout-ms: ${RIDE_TYPE_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${RIDE_TYPE_READ_TIMEOUT:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lexor.riderequest: ${LOG_LEVEL_RIDEREQUEST:DEBUG}
