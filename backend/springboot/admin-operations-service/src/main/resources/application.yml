server:
  port: ${PORT:8103}
  servlet:
    context-path: /

spring:
  application:
    name: admin-operations-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lexor_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

lexor:
  security:
    jwt:
      secret: ${JWT_SECRET:${LEXOR_JWT_SECRET:lexor-default-jwt-secret-key-32-chars-long!}}
      issuer: LEXOR
      audience: LEXOR
    internal-api-key: ${LEXOR_INTERNAL_SERVICE_KEY:lexor-internal-service-secret-key-2026}
  services:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8083}
    driver-service-url: ${DRIVER_SERVICE_URL:http://localhost:8085}
    vehicle-service-url: ${VEHICLE_SERVICE_URL:http://localhost:8087}
    ride-type-service-url: ${RIDE_TYPE_SERVICE_URL:http://localhost:8089}
    ride-request-service-url: ${RIDE_REQUEST_SERVICE_URL:http://localhost:8091}
    driver-matching-service-url: ${DRIVER_MATCHING_SERVICE_URL:http://localhost:8093}
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8095}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8097}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8099}
    feedback-service-url: ${FEEDBACK_SERVICE_URL:http://localhost:8101}
    api-gateway-url: ${API_GATEWAY_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.lexor.admin: DEBUG
    org.springframework.security: INFO
