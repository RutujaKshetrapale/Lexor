server:
  port: 0

spring:
  application:
    name: admin-operations-service-test

  datasource:
    url: jdbc:h2:mem:admin_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

lexor:
  security:
    jwt:
      secret: lexor-default-jwt-secret-key-32-chars-long!
      issuer: LEXOR
      audience: LEXOR
    internal-api-key: lexor-internal-service-secret-key-2026
  services:
    auth-service-url: http://localhost:8081
    user-service-url: http://localhost:8083
    driver-service-url: http://localhost:8085
    vehicle-service-url: http://localhost:8087
    ride-type-service-url: http://localhost:8089
    ride-request-service-url: http://localhost:8091
    driver-matching-service-url: http://localhost:8093
    booking-service-url: http://localhost:8095
    payment-service-url: http://localhost:8097
    notification-service-url: http://localhost:8099
    feedback-service-url: http://localhost:8101
    api-gateway-url: http://localhost:8080

logging:
  level:
    root: INFO
    com.lexor.admin: DEBUG
